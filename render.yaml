services:
  - type: web
    name: sgci-contable
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: SGCI_DATA_DIR
        value: /var/data
    disk:
      name: sgci-data
      mountPath: /var/data
      sizeGB: 1
